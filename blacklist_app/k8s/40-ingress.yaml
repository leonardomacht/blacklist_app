apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: blacklist-app
  namespace: blacklist
spec:
  ingressClassName: nginx
  rules:
    - host: blacklist.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: blacklist-app
                port:
                  number: 80
